[[redirects]]
  from = "/info"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/lexicon"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/lexicon/:name"
  to = "/lexicon/html/:name.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
  Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
  Content-Security-Policy = "default-src 'self'; script-src 'report-sample' 'self' 'unsafe-eval' data: https://data.bitstorm.org; style-src 'report-sample' 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; connect-src 'self' https://data.bitstorm.org; font-src 'self'; form-action 'self'; frame-ancestors 'none'; frame-src 'self'; img-src 'self'; manifest-src 'self'; media-src 'self'; worker-src 'self';"
	X-Content-Type-Options = "nosniff"
	X-Frame-Options = "DENY"
	Referrer-Policy = "no-referrer"
