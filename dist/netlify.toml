[[redirects]]
  from = "/info"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/lexicon"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/lexicon/:name"
  to = "/lexicon/html/:name.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
  Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
	X-Content-Type-Options = "nosniff"
	X-Frame-Options = "DENY"
	Referrer-Policy = "no-referrer"
